seed: 1

model:
  _yaml_: model/atlasfold.yaml
  trunk:
    blocks_per_ckpt: 8
  diffusion_head:
    blocks_per_ckpt: null
  confidence_head:
    blocks_per_ckpt: null

train:
  _yaml_: train/full.yaml
  name: stage1

  data:
    max_length: 512
    max_seq_length: 1024
    batch_size: 2
    global_batch_size: 256

    train_datasets:
      - name: rcsb
        weight: 1.0
        is_distillation: false
        sampling_strategy: ["length", "cluster"]

  training:
    train_trunk: true
    train_diffusion_head: true
    train_confidence_head: true
    train_pde_head: false
    train_pae_head: false
    diffusion_batch_size: 32
