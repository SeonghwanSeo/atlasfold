seed: 3

model:
  _yaml_: model/atlasfold.yaml
  trunk:
    blocks_per_ckpt: null
  diffusion_head:
    blocks_per_ckpt: null
  confidence_head:
    blocks_per_ckpt: null

train:
  _yaml_: train/full.yaml
  name: stage2_1
  load_opt_state: false

  data:
    max_length: 256
    max_seq_length: 512
    batch_size: 2
    global_batch_size: 8

    train_datasets:
      - name: rcsb
        weight: 1.0
        is_distillation: false
        sampling_strategy: ['length', 'cluster']

  training:
    train_trunk: false
    train_diffusion_head: true
    train_confidence_head: false
    diffusion_batch_size: 32
