seed: 2

model:
  _yaml_: _model.yaml
  trunk:
    blocks_per_ckpt: null
  diffusion_head:
    blocks_per_ckpt: null
  confidence_head:
    blocks_per_ckpt: null

train:
  _yaml_: _train_base.yaml
  name: stage2

  data:
    max_length: 384
    max_seq_length: 768
    batch_size: 1
    global_batch_size: 256

    data_root: /cache/wykim_lab/icl_shwan/atlasfold_data/
    train_datasets:
      - name: rcsb
        is_distillation: false
        weight: 0.123
        sampling_strategy: ["length", "cluster"]
      - name: disordered_pdb
        is_distillation: true
        weight: 0.002
        sampling_strategy: ["length", "cluster"]
      - name: long_monomers
        is_distillation: true
        weight: 0.865
        sampling_strategy: ["length", "plddt"]
      - name: short_monomers
        is_distillation: true
        weight: 0.010
        sampling_strategy: ["length", "plddt"]
    val_dataset:
      name: cameo_val

  loss:
    weights:
      smooth_lddt: 1.0
