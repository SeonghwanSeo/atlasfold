seed: 5

model:
  _yaml_: model/atlasfold.yaml
  confidence_head:
    blocks_per_ckpt: null

train:
  _yaml_: train/full.yaml
  name: stage5

  data:
    max_length: 768
    max_seq_length: 1280
    batch_size: 2
    global_batch_size: 256

    train_datasets:
      - name: rcsb
        is_distillation: false
        weight: 0.480
        sampling_strategy: ["length", "cluster"]
      - name: disordered_pdb
        is_distillation: true
        weight: 0.020
        sampling_strategy: ["length", "cluster"]
      - name: long_monomers
        is_distillation: true
        weight: 0.480
        sampling_strategy: ["length", "plddt"]
      - name: short_monomers
        is_distillation: true
        weight: 0.020
        sampling_strategy: ["length", "plddt"]

  training:
    train_trunk: false
    train_diffusion_head: true
    train_confidence_head: true
    train_pae_head: true
    diffusion_batch_size: 32
