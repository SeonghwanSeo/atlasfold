model:
  _yaml_: _model.yaml
  trunk:
    blocks_per_ckpt: null
train:
  _yaml_: _train_base.yaml
  name: ipa-stage2-384
  optimizer:
    max_lr: 0.0005
    lr_decay_factor: 1.0
    warmup_steps: 0
  loss:
    weights:
      violation: 1.0
      pae: 0.1
      experimentally_resolved: 0.01
  data:
    max_length: 384
    max_seq_length: 768
    data_root: /data/atlasfold_data/
    train_datasets:
      - name: rcsb
        is_distillation: false
        weight: 0.20
        sampling_strategy: ["length", "cluster"]
      - name: long_monomers
        is_distillation: true
        weight: 0.78
        sampling_strategy: ["length", "plddt"]
      - name: short_monomers
        is_distillation: true
        weight: 0.02
        sampling_strategy: ["length", "plddt"]
    val_dataset:
      name: cameo_val
