# Configuration for training
name: multimer-ipa
out_dir: ./experiments/

# Reproducibility
seed: 1

# Multi-state training
load_opt_state: true

# Compilation settings
compile:
  enabled: false
  mode: "default"
  dynamic: false

kernel:
    cuequivariance: false

# Training step hyperparameters
num_recycles: 4
mlm_prob: 0.15

data:
  # Training hyperparameters
  max_length: ???
  max_seq_length: ???
  max_templates: 2
  max_contiguous_chains: 6

  # DataLoader
  batch_size: 1
  global_batch_size: 128
  num_workers: 8
  persistent_workers: true
  pin_memory: true

  # Datasets
  data_root: ???
  train_datasets: []
  val_dataset: {}

# Lightning Trainer Configuration
trainer:
  accelerator: "auto"
  strategy: "auto"
  devices: "auto"
  num_nodes: 1
  precision: bf16-mixed
  max_epochs: -1
  limit_train_batches: 1000 # Will be multiplied by accumulate_grad_batches
  limit_val_batches: null
  log_every_n_steps: 10
  enable_checkpointing: true
  accumulate_grad_batches: null # Automatically set based on global_batch_size and batch_size
  # AF2 clips each example at global norm 0.1 before batch aggregation. Lightning's
  # automatic optimization applies the same threshold to the accumulated gradient.
  gradient_clip_val: 0.1
  gradient_clip_algorithm: norm

optimizer:
  opt: adam
  beta_1: 0.9
  beta_2: 0.999
  eps: 1.0e-6
  lr_scheduler: alphafold
  max_lr: 0.001
  warmup_steps: 1000
  decay_steps: 50000
  lr_decay_factor: 0.95
  ema_decay: 0.999
  ema_ignore_params: ["lm."]
  ema_update_params: null

loss:
  weights:
    # Global loss weights
    structure: 1.0
    violation: 0.03
    chain_center_of_mass: 1.0
    distogram: 0.3
    plddt: 0.01
    pae: 0.1
    experimentally_resolved: 0.01

  # Distogram loss
  distogram_loss:
    include_self_pairs: true

  # Structural violation loss
  violation_loss:
    bond_angle_weight: 0.3
    clash_overlap_tolerance: 1.5
    violation_tolerance_factor: 12.0

  # Chain center-of-mass loss
  chain_center_of_mass_loss:
    distance_scale: 20.0
    tolerance: 4.0

  # Confidence loss
  confidence_loss:
    plddt_loss: {}
    pae_loss:
      frame_style: af2
    experimentally_resolved_loss: {}

wandb:
  use: false
  project: "AtlasFold_IPA_Multimer" # Set your project name
  entity: null # Defaults to the authenticated user's entity
