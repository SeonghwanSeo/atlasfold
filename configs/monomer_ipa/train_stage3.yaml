model:
  _yaml_: _model.yaml
  lm_path: ./weights/atlaslm_3b_base.pth
  trunk:
    blocks_per_ckpt: 8

train:
  _yaml_: _train_base.yaml
  name: ipa-stage3-512
  seed: 1

  load_opt_state: false

  optimizer:
    max_lr: 0.0005
    lr_decay_factor: 1.0
    warmup_steps: 0

  loss:
    weights:
      violation: 1.0
      experimentally_resolved: 0.01

  data:
    max_length: 512
    max_seq_length: 1024
    resample_threshold: 0
    cropper:
      prob_contiguous: 0.9
      prob_multi_contiguous: 0.1

    data_root: /cache/wykim_lab/icl_shwan/atlasfold_data/
    train_datasets:
      - name: rcsb
        is_distillation: false
        weight: 0.25
        sampling_strategy: ["length", "cluster"]
      - name: disordered_pdb
        is_distillation: true
        weight: 0.01
        sampling_strategy: ["length", "cluster"]
        residue_plddt_threshold: 0.0
      - name: long_monomers
        is_distillation: true
        weight: 0.73
        sampling_strategy: ["length"]
        residue_plddt_threshold: 0.0
      - name: short_monomers
        is_distillation: true
        weight: 0.01
        sampling_strategy: ["length"]
        residue_plddt_threshold: 0.0
    val_dataset:
      name: cameo_val
