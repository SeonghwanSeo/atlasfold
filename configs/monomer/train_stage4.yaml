seed: 4

model:
  _yaml_: _model.yaml
  diffusion_head:
    blocks_per_ckpt: null
  confidence_head:
    blocks_per_ckpt: null

train:
  _yaml_: _train_base.yaml
  name: stage4

  data:
    max_length: 512
    max_seq_length: 1024
    batch_size: 2
    global_batch_size: 256

    data_root: /cache/wykim_lab/icl_shwan/atlasfold_data/
    train_datasets:
      - name: rcsb
        is_distillation: false
        weight: 0.500
        sampling_strategy: ["length", "cluster"]
      - name: disordered_pdb_afm
        is_distillation: true
        weight: 0.020
        sampling_strategy: ["length", "cluster"]
      - name: long_monomers
        is_distillation: true
        weight: 0.470
        sampling_strategy: ["plddt"]
      - name: short_monomers
        is_distillation: true
        weight: 0.010
        sampling_strategy: ["plddt"]
    val_dataset:
      name: cameo_val

  training:
    train_trunk: false
    train_diffusion_head: true
    train_confidence_head: true
    train_pae_head: true
    diffusion_batch_size: 32
    num_recycles: 4

  load_opt_state: false
  init_from_ema: ["trunk"]

  optimizer:
    max_lr: 1e-3
    lr_decay_factor: 1.0
    ema_update_params: ["diffusion_head.", "confidence_head."]

  validation:
    num_diffusion_samples: 5
