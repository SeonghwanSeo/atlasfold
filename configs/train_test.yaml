seed: 1

model:
  _yaml_: model/atlasfold.yaml
  trunk:
    blocks_per_ckpt: null
  diffusion_head:
    blocks_per_ckpt: null
  confidence_head:
    blocks_per_ckpt: null

train:
  _yaml_: train/full.yaml
  name: stage1

  data:
    max_length: 256
    max_seq_length: 512
    batch_size: 2
    global_batch_size: 128

    train_datasets:
      - name: rcsb
        weight: 1.0
        is_distillation: false
        sampling_strategy: ['length', 'cluster']

  training:
    train_trunk: true
    train_diffusion_head: true
    train_confidence_head: false
    diffusion_batch_size: 32

  loss:
    weights:
      smooth_lddt: 1.0

    diffusion_loss:
      smooth_lddt_loss:
        chunk_size: 16
