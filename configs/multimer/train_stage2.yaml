seed: 2

model:
  _yaml_: _model.yaml
  trunk:
    blocks_per_ckpt: 16
  template_module:
    blocks_per_ckpt: null
  diffusion_head:
    blocks_per_ckpt: null

train:
  _yaml_: _train_base.yaml
  name: stage2-640

  init_from_ema: ['trunk', 'diffusion_head', 'confidence_head']

  optimizer:
    max_lr: 0.001
    warmup_steps: 0
    decay_steps: 1000000000

  data:
    max_length: 640
    max_seq_length: 1280
    max_templates: 2
    max_contiguous_chains: 6

    batch_size: 1
    global_batch_size: 256

    data_root: /cache/wykim_lab/icl_shwan/atlasfold_data/
    train_datasets:
      - name: rcsb_multimer
        type: rcsb
        is_multimer: true
        is_distillation: false
        use_templates: true
        weight: 0.50
        template_prob: 0.4
      - name: disordered_pdb_multimer
        type: rcsb
        is_multimer: true
        is_distillation: true
        use_templates: false
        weight: 0.01
      - name: long_monomers
        type: monomer_distillation
        is_multimer: false
        is_distillation: true
        use_templates: false
        weight: 0.48
      - name: short_monomers
        type: monomer_distillation
        is_multimer: false
        is_distillation: true
        use_templates: false
        weight: 0.01
    val_dataset:
      name: rcsb_multimer_val
      type: rcsb
      use_templates: false

  training:
    train_trunk: true
    train_diffusion_head: true
    train_confidence_head: true
    train_pde_head: true
    train_pae_head: true
    diffusion_batch_size: 32
